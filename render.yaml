# Despliegue del backend de Kinti en Render.
#
# Los secretos NO van aquí: se marcan `sync: false` y se rellenan una sola vez
# en el panel de Render. Este archivo sí se versiona.
#
# IMPORTANTE — conexión a Supabase:
# Render sólo hace egress IPv4, y la conexión directa de Supabase
# (`db.<ref>.supabase.co`) resuelve únicamente a IPv6. Hay que usar el
# **Session Pooler** (`aws-0-<región>.pooler.supabase.com`), que sí tiene IPv4.
#
# Transaction mode NO sirve: rompe los prepared statements de asyncpg y los
# locks de DDL de Alembic.

services:
  - type: web
    name: kinti-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Kinti Voz recibe webhooks telefónicos en este mismo proceso. No separar el
    # módulo de voz durante el MVP evita otro salto de red y conserva una sola
    # transacción para sesión, solicitud y callback.
    #
    # `free` es una decisión consciente para el MVP: alcanza para el simulador,
    # la aplicación y las vistas adultas, que es lo que se demuestra hoy.
    #
    # **No alcanza para una llamada telefónica real.** El plan Free suspende el
    # servicio por inactividad y el arranque en frío tarda decenas de segundos,
    # mientras que un webhook de Twilio expira en unos quince: la primera
    # llamada después de un rato de silencio fallaría, y fallaría justo en la
    # demostración. Pasar a `starter` es requisito de la telefonía real, no una
    # mejora opcional — igual que la puerta de `config.py`, que bloquea Twilio
    # hasta que el workflow sea durable.
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      # --- Base de datos (Session Pooler, IPv4) -------------------------------
      - key: KINTI_DATABASE_URL
        sync: false
      - key: KINTI_MIGRATION_DATABASE_URL
        sync: false

      # El pooler NO usa una CA pública: está firmado por la misma CA propia de
      # Supabase que la conexión directa. Sin el certificado, la verificación
      # falla con «self-signed certificate in certificate chain» y todo endpoint
      # que toque la base devuelve 500.
      #
      # `supabase-ca.crt` es un certificado raíz público (Supabase lo publica en
      # su dashboard), así que se versiona en el repositorio sin problema.
      - key: KINTI_REQUIRE_TLS
        value: "true"
      - key: KINTI_DB_SSL_ROOT_CERT
        value: "supabase-ca.crt"

      # El plan gratuito de Supabase limita conexiones; el pooler las multiplexa,
      # pero conviene no abrir más de las necesarias.
      - key: KINTI_DB_POOL_SIZE
        value: "3"
      - key: KINTI_DB_MAX_OVERFLOW
        value: "2"

      # --- Sesión -------------------------------------------------------------
      - key: KINTI_JWT_SECRET
        generateValue: true
      - key: KINTI_ACCESS_TOKEN_MINUTES
        value: "30"
      - key: KINTI_REFRESH_TOKEN_DAYS
        value: "14"

      # --- Supabase Storage ---------------------------------------------------
      - key: KINTI_STORAGE_PROVIDER
        value: supabase
      - key: KINTI_SUPABASE_URL
        sync: false
      - key: KINTI_SUPABASE_SERVICE_KEY
        sync: false

      # --- IA -----------------------------------------------------------------
      # `fake` por defecto: activar un proveedor real es una decisión consciente,
      # no algo que ocurra por omisión al desplegar.
      - key: KINTI_AI_PROVIDER
        value: fake
      - key: KINTI_EMBEDDING_PROVIDER
        value: fake
      - key: KINTI_EMBEDDING_DIMENSION
        value: "768"
      - key: KINTI_RAG_TOP_K
        value: "5"

      # --- Kinti Voz (Fase 5A) ----------------------------------------------
      # El despliegue conserva fakes hasta autorizar número, presupuesto,
      # identidad, retención y SLA. `fake` nunca confirma una cita real.
      - key: KINTI_TELEPHONY_PROVIDER
        # Ausente = `fake` por defecto. La configuración actual rechaza `twilio`
        # aun con secretos; un cambio posterior revisado deberá retirar ese gate
        # sólo después de completar todas las puertas del runbook.
        sync: false
      - key: KINTI_REFERRAL_PROVIDER
        value: fake
      - key: KINTI_SCHEDULING_PROVIDER
        value: fake
      - key: KINTI_STT_PROVIDER
        value: fake
      - key: KINTI_TTS_PROVIDER
        value: fake
      - key: KINTI_VOICE_MODE
        value: turn
      - key: KINTI_VOICE_LANGUAGE
        value: es-PE
      - key: KINTI_VOICE_DEFAULT_SPEECH_RATE
        value: slow
      - key: KINTI_VOICE_MAX_CALL_SECONDS
        value: "480"
      - key: KINTI_VOICE_MAX_REPROMPTS
        value: "2"
      - key: KINTI_VOICE_RECORDING_ENABLED
        value: "false"
      - key: KINTI_VOICE_TRANSCRIPT_RETENTION_ENABLED
        value: "false"
      - key: KINTI_VOICE_CALLBACK_ENABLED
        value: "true"
      - key: KINTI_TELEPHONY_WEBHOOK_SECRET
        generateValue: true

      # Contrato futuro. Aunque se rellenen, el runtime Fase 5A bloquea Twilio
      # hasta existir workflow durable, gateways institucionales y plan always-on.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WEBHOOK_BASE_URL
        sync: false

      # --- Dominio ------------------------------------------------------------
      - key: KINTI_ENVIRONMENT
        value: staging
      - key: KINTI_BARRIER_RESPONSE_WINDOW_HOURS
        value: "48"
      - key: KINTI_MISSED_TOLERANCE_HOURS
        value: "6"

      # Orígenes web permitidos. La app nativa no usa CORS.
      - key: KINTI_CORS_ORIGINS
        value: "http://localhost:8081,http://localhost:19006"
